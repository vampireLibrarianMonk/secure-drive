name: CI

# Build and test in the pinned .NET SDK container (the same image and commands
# as scripts/build-in-docker.ps1 and scripts/test-linux.ps1). This mirrors the
# "build in a container, ship self-contained" model: the runner needs no host
# SDK, and the produced binaries are self-contained so the drive stays
# SDK-free and Docker-free.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & test (net10.0)
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/dotnet/sdk:10.0
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Restore
        run: dotnet restore EmergencyArchive.slnx

      - name: Build (Release, warnings are errors)
        run: dotnet build EmergencyArchive.slnx -c Release --no-restore

      - name: Test
        run: dotnet test EmergencyArchive.slnx -c Release --no-build --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-results
          path: "**/test-results.trx"
          if-no-files-found: ignore

  linux-self-contained-smoke:
    name: Self-contained linux-x64 smoke
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Publish a self-contained VaultCli in the SDK container, then run it in a
      # bare Ubuntu image with NO .NET runtime — proving the emergency-computer
      # deployment model (matches scripts/test-linux.ps1 step 2).
      - name: Publish self-contained VaultCli (SDK container)
        run: |
          docker run --rm -v "$PWD:/src" -w /src \
            -e DOTNET_CLI_TELEMETRY_OPTOUT=1 -e DOTNET_NOLOGO=1 -e HOME=/tmp \
            mcr.microsoft.com/dotnet/sdk:10.0 \
            bash -lc "dotnet publish tools/VaultCli -c Release -r linux-x64 --self-contained true -p:PublishSingleFile=true -o /src/artifacts/ci-smoke -v minimal"

      - name: Run it on bare Ubuntu (no .NET runtime)
        run: |
          docker run --rm -v "$PWD/artifacts/ci-smoke:/app" ubuntu:24.04 \
            bash -lc "/app/VaultCli | grep -q Usage && echo SELF-CONTAINED-VAULTCLI-SMOKE-OK"
